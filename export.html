<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- translate tailwind to css -->
    <link rel="stylesheet" href="dist/output.css">

    <!-- business logo -->
    <link rel="icon" href="assets/images/company_logo.png" type="image/png" />

    <!-- website title -->
    <title>Products | CV Java Indo Nusantara</title>
</head>

<body class="bg-gray-200">

    <!-- Hero container -->
    <header class="relative h-[300px] bg-cover bg-center"
        style="background-image: url('assets/images/hero_background.png');">

        <!-- content section -->
        <div class="flex gap-20 px-10 md:px-28 flex min-h-screen py-8 md:py-10 flex-col">
            <!-- content -->
            <div id="navbar"></div>
            <div class="text-white font-lato text-4xl font-bold">
                <h1><span class="text-important">Our</span> Product Variant's</h1>
            </div>
        </div>


        <div class="absolute -bottom-4 left-0 w-full">
            <div class="dot-pattern h-20"></div>
            <div class="px-8 md:px-28 flex gap-4 translate-y-3.5">
                <div class="glass-box w-24 h-14 sm:w-40 md:w-[400px] md:h-14"></div>
                <div class="glass-box w-20 h-14 sm:w-18 md:w-40 md:h-14"></div>
                <div class="glass-box w-14 h-14 sm:w-14 md:w-20 md:h-14"></div>
                <div class="glass-box w-8 h-14 sm:w-10 md:w-10 md:h-14"></div>
                <div class="glass-box w-4 h-14 sm:w-4 md:w-8 md:h-14"></div>
            </div>
        </div>
    </header>

    <!-- main content -->
    <div>

    </div>

    <div id="footer"></div>
    <script src="js/loadComponent.js"></script>
</body>

</html>
