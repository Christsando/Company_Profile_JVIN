<!DOCTYPE html>
<html>

<head>
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- translate tailwind to css -->
    <link rel="stylesheet" href="dist/output.css">
</head>

<body class="bg-gray-200">

    <!-- Hero content -->
    <div class="relative">
        <!-- Background image hero -->
        <img src="assets/images/hero_background.png" class="w-full h-screen object-cover object-center" />

        <!-- Hero content -->
        <div class="absolute top-0 left-0 w-full px-28">
            <div class="flex min-h-screen py-10 justify-between flex-col">

                <!-- Navbar -->
                <div id="navbar"></div>

                <div class="flex flex-col gap-8">

                    <!-- Quote and Company Logo-->
                    <div class="flex justify-between text-white font-lato text-4xl">
                        <h2>“Delivering premium charcoal with </br> <span
                                class="font-extrabold text-important">consistent quality</span> for <span
                                class="font-extrabold text-important">global standards.</span>”</h2>
                        <img src="assets/images/company_logo.png" alt="company_logo"
                            class="w-20 h-20 object-cover object-center" />
                    </div>

                    <!-- Our truster section -->
                    <div>
                        <p class="font-lato text-secondaryTeks mb-2">OUR TRUSTED FORWARDERS</p>
                        <hr class="mb-4"/>
                        <div>
                            <ul class="flex gap-10 text-lg text-secondaryTeks">
                                <li>Shopee</li>
                                <li>Tokopedia</li>
                                <li>Bukalapak</li>
                                <li>Duilingo</li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="js/loadComponent.js"></script>
</body>

</html>
