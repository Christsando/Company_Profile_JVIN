<!DOCTYPE html>
<html>

<head>
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- translate tailwind to css -->
    <link rel="stylesheet" href="dist/output.css">
    <!-- tailwind script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- business logo -->
    <link rel="icon" href="assets/images/company_logo.png" type="image/png" />
    <!-- website title -->
    <title>Home | CV Java Indo Nusantara</title>
</head>

<body class="bg-gray-200">

    <!-- Hero content -->
    <div class="relative">
        <!-- Background image hero -->
        <img src="assets/images/hero_background.png" class="w-full h-screen object-cover object-center" />

        <!-- Hero content -->
        <div class="absolute top-0 left-0 w-full px-8 md:px-28">
            <div class="flex min-h-screen py-4 md:py-10 justify-between flex-col">
                <!-- Navbar -->
                <div id="navbar"></div>
                <!-- Hero -->
                <div id="hero"></div>
            </div>
        </div>

        <!-- Deecorative -->
        <div class="dot-pattern bottom-5 h-20"></div>
        <div class="px-8 md:px-28 flex gap-4 -translate-y-8">
            <div class="glass-box w-24 h-14 sm:w-40 h-14 md:w-[400px] md:h-14"></div>
            <div class="glass-box w-20 h-14 sm:w-18 h-14 md:w-40 md:h-14"></div>
            <div class="glass-box w-14 h-14 sm:w-14 h-14 md:w-20 md:h-14"></div>
            <div class="glass-box w-8 h-14 sm:w-8 h-14 md:w-10 md:h-14"></div>
            <div class="glass-box w-4 h-14 sm:w-4 h-14 md:w-8 md:h-14"></div>
        </div>

    </div>

    <!-- Home content -->
    <div class="flex flex-col gap-12 py-8 mt-12">
        <div id="customer-need"></div>
        <div id="charcoal-process"></div>
        <div id="products" class="mt-14"></div>
        <div id="packaging" class="mt-14"></div>
        <div id="question" class="mt-14"></div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="js/loadComponent.js"></script>
</body>

</html>
